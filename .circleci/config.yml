version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Build Spring Boot Application
          command: mvn clean install -DskipTests

      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}

      - persist_to_workspace:
          root: .
          paths:
            - target/*.jar
  test:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Run Automated Tests
          command: mvn test

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports

  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      - attach_workspace:
          at: .

      - setup_remote_docker

      - run:
          name: Build Docker Image
          command: docker build -t $DOCKER_USERNAME/devops-demo:latest .

      - run:
          name: Login to Docker Hub
          command: echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - run:
          name: Push Docker Image
          command: docker push $DOCKER_USERNAME/devops-demo:latest

workflows:
  build_test_publish:
    jobs:
      - build

      - test:
          requires:
            - build

      - publish:
          requires:
            - test
          context: docker-hub
